spring:
  application:
    name: nhom11
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./application-local.yaml"
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:n11_toeic}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
    encoding:
      charset: UTF-8
      force: true
